<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#234F4D">
<title>Slaid Modul PFA — 8 Unit · JPN Kedah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FAF6EF; --cream-2:#F2ECE0;
  --teal:#2F6E6B; --teal-deep:#234F4D; --teal-xd:#1C403E; --teal-soft:#CFE3E1;
  --sage:#9CB380; --sage-soft:#C7D6B3; --sage-bg:#E7F0E5;
  --amber:#E9A178; --amber-bg:#F7E6DB; --amber-tx:#A85A30;
  --slate:#26403E; --soft:#5A716E; --line:rgba(38,64,62,.14);
  --f-head:'Fraunces',Georgia,serif;
  --f-body:'Plus Jakarta Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f-body);background:#16302E;color:var(--slate);-webkit-font-smoothing:antialiased}

/* ==================== RANGKA ==================== */
.app{display:flex;height:100vh;width:100vw}

/* -------- SIDEBAR -------- */
.sb{
  width:270px;flex:none;background:var(--teal-deep);color:#fff;
  display:flex;flex-direction:column;transition:width .25s ease;overflow:hidden;
}
.sb.tutup{width:0}
.sb-atas{padding:16px 18px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.sb-balik{
  display:inline-block;text-decoration:none;font-size:.76rem;font-weight:600;
  color:#9FB5B2;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  border-radius:8px;padding:.4em .75em;margin-bottom:12px;transition:.15s;
}
.sb-balik:hover{background:rgba(255,255,255,.2);color:#fff}
.sb-atas .jenama{font-family:var(--f-head);font-weight:600;font-size:1.05rem;line-height:1.2;white-space:nowrap}
.sb-atas small{display:block;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sage-soft);margin-top:.35em}
.sb-list{flex:1;overflow-y:auto;padding:10px 10px 14px}
.sb-list::-webkit-scrollbar{width:6px}
.sb-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:99px}
.ub{
  width:100%;text-align:left;font-family:inherit;cursor:pointer;
  background:transparent;border:1px solid transparent;border-radius:11px;
  padding:11px 12px;margin-bottom:5px;color:#CBD9D6;transition:.16s;
  display:flex;gap:11px;align-items:flex-start;
}
.ub:hover{background:rgba(255,255,255,.08);color:#fff}
.ub.on{background:var(--teal);border-color:var(--sage);color:#fff}
.ub .no{
  flex:none;width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--f-head);font-weight:700;font-size:.82rem;
}
.ub.on .no{background:var(--sage);color:#1C403E}
.ub .tx{min-width:0;flex:1}
.ub .tx b{display:block;font-size:.86rem;font-weight:600;line-height:1.3;color:#CBD9D6}
.ub.on .tx b{color:#fff}
.ub .tx small{display:block;font-size:.7rem;color:#93AAA7;margin-top:.2em}
.ub.on .tx small{color:var(--sage-soft)}
.sb-bawah{padding:12px 14px;border-top:1px solid rgba(255,255,255,.12);font-size:.7rem;color:#8CA5A2;line-height:1.6}
.sb-bawah b{color:var(--amber)}

/* -------- PENTAS SLAID -------- */
.pentas{
  flex:1;position:relative;display:flex;align-items:center;justify-content:center;
  background:#16302E;overflow:hidden;
}
/* slaid saiz tetap 1280x720 — diskala agar muat. Ini menjamin saiz
   taip yang boleh diramal, tidak kira besar mana skrin projektor. */
.slaid{
  width:1280px;height:720px;flex:none;background:var(--cream);
  transform-origin:center center;position:relative;overflow:hidden;
  box-shadow:0 30px 90px -30px rgba(0,0,0,.7);
}
.slaid.gelap{background:var(--teal-deep);color:#fff}

/* -------- ISI SLAID -------- */
.s-in{position:absolute;inset:0;padding:58px 72px 84px;display:flex;flex-direction:column}
.s-eyebrow{
  font-size:15px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--teal);display:flex;align-items:center;gap:12px;margin-bottom:18px;flex:none;
}
.s-eyebrow::before{content:"";width:30px;height:3px;background:var(--sage);flex:none}
.gelap .s-eyebrow{color:var(--sage-soft)}
.gelap .s-eyebrow::before{background:var(--amber)}

.s-tajuk{font-family:var(--f-head);font-weight:600;font-size:46px;line-height:1.1;color:var(--slate);flex:none;letter-spacing:-.01em}
.gelap .s-tajuk{color:#fff}
.s-badan{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;margin-top:16px;
  font-size:calc(20px * var(--fit,1))}

p.s-teks{font-size:1.35em;line-height:1.5;color:var(--slate)}
.gelap p.s-teks{color:#CBD9D6}
b{color:var(--teal-deep);font-weight:700}
.gelap b{color:var(--sage-soft)}
em{color:var(--teal);font-style:italic}

/* poin */
ul.s-poin{list-style:none;display:flex;flex-direction:column;gap:20px}
ul.s-poin.dua{display:block;columns:2;column-gap:52px}
ul.s-poin.dua li{break-inside:avoid;margin-bottom:16px}
ul.s-poin li{position:relative;padding-left:1.8em;font-size:1.25em;line-height:1.45}
ul.s-poin li::before{
  content:"";position:absolute;left:0;top:.45em;width:.7em;height:.7em;
  border-radius:.2em;background:var(--sage);transform:rotate(45deg);
}
ul.s-poin.padat li{font-size:1.1em}

/* banding */
.s-banding{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
.bk{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px 28px;box-shadow:0 14px 36px -22px rgba(35,79,77,.4)}
.bk h4{font-family:var(--f-head);font-size:1.35em;font-weight:600;color:var(--teal-deep);margin-bottom:16px}
.bk.kanan h4{color:var(--amber-tx)}
.bk ul{list-style:none;display:flex;flex-direction:column;gap:13px}
.bk li{font-size:1.05em;line-height:1.4;padding-left:28px;position:relative;color:var(--slate)}
.bk li::before{content:"";position:absolute;left:2px;top:10px;width:11px;height:11px;border-radius:3px;background:var(--sage);transform:rotate(45deg)}
.bk.kanan li::before{background:var(--amber)}

/* kad */
.s-kad{display:grid;gap:20px}
.s-kad.k2{grid-template-columns:1fr 1fr}
.s-kad.k3{grid-template-columns:repeat(3,1fr)}
.s-kad.k4{grid-template-columns:repeat(2,1fr)}
.kd{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:0 12px 30px -20px rgba(35,79,77,.4)}
.kd h4{font-family:var(--f-head);font-size:1.15em;font-weight:600;color:var(--teal-deep);margin-bottom:10px;line-height:1.25}
.kd p{font-size:.95em;line-height:1.5;color:var(--soft)}
.s-kad.k3 .kd h4{font-size:1.05em}
.s-kad.k3 .kd p{font-size:.875em}
.s-kad.k4 .kd{padding:18px 20px}
.s-kad.k4 .kd h4{font-size:1.05em}
.s-kad.k4 .kd p{font-size:.85em}

/* kulit unit */
.kulit-num{font-family:var(--f-head);font-size:190px;font-weight:600;color:var(--teal);opacity:.45;line-height:.8;position:absolute;right:72px;bottom:78px}
.kulit-obj{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:24px 28px;margin-top:26px;max-width:820px}
.kulit-obj b{display:block;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage-soft);margin-bottom:12px}
.kulit-obj ul{list-style:none;display:flex;flex-direction:column;gap:11px}
.kulit-obj li{font-size:21px;line-height:1.4;color:#DCE7E4;padding-left:30px;position:relative}
.kulit-obj li::before{content:"→";position:absolute;left:0;color:var(--amber);font-weight:700}

/* ==================== KOMPONEN INTERAKTIF ==================== */
.ia-nota{font-size:.95em;color:var(--soft);margin-bottom:16px}

/* piramid */
.ia-pir{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center}
.ia-pir svg{width:100%;max-width:440px;margin:0 auto;display:block}
.ia-pir path{cursor:pointer;transition:opacity .2s}
.ia-pir path:hover{opacity:.85}
.ia-pir path.sel{stroke:var(--slate);stroke-width:4}
.pir-kotak{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 26px;min-height:270px}
.pir-kotak .lbl{font-size:.65em;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sage)}
.pir-kotak h4{font-family:var(--f-head);font-size:1.3em;color:var(--teal-deep);margin:6px 0 12px}
.pir-kotak p{font-size:.95em;line-height:1.5;color:var(--slate);margin-bottom:10px}
.pir-kotak .siapa{font-size:.85em;color:var(--teal-deep);border-top:1px solid var(--line);padding-top:10px;margin-top:4px}

/* pernafasan */
.ia-nafas{display:flex;flex-direction:column;align-items:center;gap:20px}
.nf-bulat{
  width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,var(--sage-soft),var(--teal));
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 26px 60px -26px rgba(47,110,107,.8);transition:transform 1s ease-in-out;
}
.nf-bulat b{font-family:var(--f-head);font-size:52px;line-height:1}
.nf-bulat small{font-size:19px;opacity:.92;margin-top:8px}
.nf-kawal{display:flex;align-items:center;gap:18px}
.nf-btn{
  font-family:inherit;font-size:19px;font-weight:600;cursor:pointer;color:#fff;
  background:var(--teal);border:none;border-radius:12px;padding:12px 28px;transition:.16s;
}
.nf-btn:hover{background:var(--teal-deep)}
.nf-kira{font-size:19px;color:var(--soft);font-weight:600}

/* grounding */
.ia-gr{display:flex;flex-direction:column;gap:12px}
.gr-b{
  display:flex;align-items:center;gap:24px;background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:16px 26px;transition:.25s;
}
.gr-b.aktif{background:var(--sage-bg);border-color:var(--sage);transform:scale(1.02)}
.gr-b .n{font-family:var(--f-head);font-size:2.2em;font-weight:600;color:var(--sage);width:60px;text-align:center;flex:none;line-height:1}
.gr-b b{font-size:1.2em;color:var(--slate);display:block}
.gr-b small{font-size:.95em;color:var(--soft)}

/* validasi */
.ia-val{display:flex;flex-direction:column;gap:14px}
.vl{display:grid;grid-template-columns:1fr 1fr;gap:0;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.vl>div{padding:16px 22px}
.vl .elak{background:var(--amber-bg)}
.vl .ganti{background:var(--sage-bg);border-left:1px solid var(--line)}
.vl .lbl{font-size:.6em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;opacity:.75}
.vl .elak .lbl{color:var(--amber-tx)}
.vl .ganti .lbl{color:#3C6B3A}
.vl p{font-size:1em;line-height:1.4;color:var(--slate)}

/* kotak nota bawah slaid */
.s-nota{
  flex:none;margin-top:18px;border-radius:14px;padding:16px 22px;font-size:19px;line-height:1.45;
  background:var(--sage-bg);border:1px solid #CADFC4;
}
.s-nota.amber{background:var(--amber-bg);border-color:#F0CDB6}
.s-nota .lbl{font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#3C6B3A;display:block;margin-bottom:5px}
.s-nota.amber .lbl{color:var(--amber-tx)}

/* jalur HEAL pada setiap slaid */
.s-heal{
  position:absolute;left:0;right:0;bottom:0;height:44px;background:var(--slate);
  color:#D3DEDC;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;
}
.s-heal b{color:var(--amber)}
.gelap .s-heal{background:var(--teal-xd)}

/* nombor slaid dalam unit */
.s-kaki{position:absolute;right:24px;bottom:56px;font-size:15px;font-weight:600;color:var(--soft)}
.gelap .s-kaki{color:#7E9996}

/* ==================== KAWALAN ==================== */
.kawal{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:50;
  display:flex;align-items:center;gap:8px;
  background:rgba(20,44,42,.92);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 9px;
  transition:opacity .4s ease;
}
.kawal.lesap{opacity:0;pointer-events:none}
.kawal button{
  font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;color:#DCE7E4;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
  border-radius:999px;padding:7px 14px;transition:.15s;white-space:nowrap;
}
.kawal button:hover{background:rgba(255,255,255,.22);color:#fff}
.kawal button:disabled{opacity:.3;cursor:default}
.kawal .kbalik{
  font-family:inherit;font-size:14px;font-weight:600;text-decoration:none;color:#DCE7E4;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
  border-radius:999px;padding:7px 14px;transition:.15s;white-space:nowrap;
}
.kawal .kbalik:hover{background:rgba(255,255,255,.22);color:#fff}
.kawal .kira{font-size:14px;font-weight:700;color:#fff;padding:0 10px;min-width:74px;text-align:center;font-variant-numeric:tabular-nums}
.kawal .kira small{display:block;font-size:11px;font-weight:500;color:#9FB5B2}

.tip{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:60;
  background:rgba(20,44,42,.94);color:#DCE7E4;font-size:13px;font-weight:600;
  padding:9px 18px;border-radius:999px;transition:opacity .6s;pointer-events:none;
}

/* zon ketuk */
.zon{position:absolute;top:0;bottom:70px;width:14%;z-index:20;cursor:pointer}
.zon.kiri{left:0}.zon.kanan{right:0}

@media(max-width:720px){
  .sb{position:fixed;inset:0 auto 0 0;z-index:70;box-shadow:0 0 60px rgba(0,0,0,.5)}
  .kawal{bottom:10px}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sb" id="sb">
    <div class="sb-atas">
      <a class="sb-balik" href="index.html">← Dashboard</a>
      <div class="jenama">Modul PFA</div>
      <small>JPN Kedah × JKN Kedah</small>
    </div>
    <div class="sb-list" id="sbList"></div>
    <div class="sb-bawah">
      Sokongan emosi<br><b>Talian HEAL 15555</b>
    </div>
  </aside>

  <div class="pentas" id="pentas">
    <div class="zon kiri" id="zonKiri"></div>
    <div class="zon kanan" id="zonKanan"></div>
    <div class="slaid" id="slaid"></div>
  </div>
</div>

<div class="kawal">
  <a class="kbalik" href="index.html" title="Kembali ke dashboard">← Dashboard</a>
  <button id="bSb" title="Sembunyi/papar senarai unit">☰</button>
  <button id="bPrev">‹</button>
  <div class="kira"><span id="kNo">1 / 1</span><small id="kUnit">Unit 1</small></div>
  <button id="bNext">›</button>
  <button id="bFull" title="Skrin penuh (F)">⛶ Penuh</button>
</div>

<div class="tip" id="tip">← → tukar slaid · 1–8 tukar unit · F skrin penuh · S sidebar</div>

<script src="content.js"></script>
<script>
(function(){
  'use strict';

  /* ---------- pembantu ---------- */
  const $ = s => document.querySelector(s);
  function bersih(t){
    /* {{ISTILAH}} → teks biasa (tooltip tidak berguna semasa dibentangkan) */
    return String(t == null ? '' : t).replace(/\{\{(.+?)\}\}/g, '$1');
  }

  /* ==========================================================
     BINA SLAID DARIPADA content.js
     Setiap unit: 1 slaid kulit + 1 slaid bagi setiap seksyen
     ========================================================== */
  const DECK = UNITS.map(u => {
    const slaid = [];

    /* --- kulit unit --- */
    slaid.push({ jenis:'kulit', unit:u });

    /* --- seksyen --- */
    u.seksyen.forEach(s => slaid.push({ jenis:'seksyen', unit:u, s }));

    return { unit:u, slaid };
  });

  let iu = 0, is = 0;   // indeks unit, indeks slaid dalam unit

  /* ==========================================================
     PENGHASIL HTML BAGI SETIAP JENIS SLAID
     ========================================================== */

  function htmlKulit(u){
    return `
      <div class="s-in">
        <div class="s-eyebrow">Unit ${u.id} · ${bersih(u.tempoh)}</div>
        <h1 class="s-tajuk">${bersih(u.tajuk)}</h1>
        <div class="s-badan" style="justify-content:flex-start">
          <p class="s-teks" style="max-width:900px">${bersih(u.ringkas)}</p>
          <div class="kulit-obj">
            <b>Objektif Pembelajaran</b>
            <ul>${u.objektif.map(o=>`<li>${bersih(o)}</li>`).join('')}</ul>
          </div>
        </div>
        <div class="kulit-num">${u.id}</div>
      </div>`;
  }

  function htmlBawa(u){
    return `
      <div class="s-in">
        <div class="s-eyebrow">Unit ${u.id} · Poin Bawa Balik</div>
        <h1 class="s-tajuk">Tiga perkara untuk diingat</h1>
        <div class="s-badan">
          <ul class="s-poin">
            ${u.bawaBalik.map(b=>`<li>${bersih(b)}</li>`).join('')}
          </ul>
        </div>
      </div>`;
  }

  function htmlSeksyen(u, s, no, jum){
    let badan = '';
    let tajuk = s.tajuk ? bersih(s.tajuk) : bersih(u.tajuk);

    if (s.j === 'prosa') {
      badan = `<p class="s-teks">${bersih(s.teks)}</p>`;
      tajuk = s.tajuk ? bersih(s.tajuk) : bersih(u.tajuk);
    }

    if (s.j === 'poin') {
      const n = s.items.length;
      const kelas = n > 8 ? ' dua' : (n > 4 ? ' padat' : '');
      badan = `<ul class="s-poin${kelas}">
        ${s.items.map(i=>`<li>${bersih(i.t)}</li>`).join('')}
      </ul>`;
    }

    if (s.j === 'banding') {
      badan = `<div class="s-banding">
        <div class="bk"><h4>${bersih(s.kiri.tajuk)}</h4>
          <ul>${s.kiri.items.map(i=>`<li>${bersih(i)}</li>`).join('')}</ul></div>
        <div class="bk kanan"><h4>${bersih(s.kanan.tajuk)}</h4>
          <ul>${s.kanan.items.map(i=>`<li>${bersih(i)}</li>`).join('')}</ul></div>
      </div>`;
    }

    if (s.j === 'kad') {
      const n = s.items.length;
      const kelas = n <= 2 ? 'k2' : (n === 3 ? 'k3' : 'k4');
      badan = `<div class="s-kad ${kelas}">
        ${s.items.map(i=>`<div class="kd">
          <h4>${bersih(i.tajuk)}</h4><p>${bersih(i.isi)}</p>
        </div>`).join('')}
      </div>`;
    }

    if (s.j === 'ia') {
      badan = `${s.nota ? `<div class="ia-nota">${bersih(s.nota)}</div>` : ''}
        <div data-ia="${s.komponen}"></div>`;
    }

    return `
      <div class="s-in">
        <div class="s-eyebrow">Unit ${u.id} · ${bersih(u.tajuk)}</div>
        <h1 class="s-tajuk">${tajuk}</h1>
        <div class="s-badan">${badan}</div>
        <div class="s-kaki">${no} / ${jum}</div>
      </div>`;
  }

  /* ==========================================================
     KOMPONEN INTERAKTIF (versi besar untuk projektor)
     ========================================================== */

  function pasangPiramid(el){
    const pts = [
      'M640 60 L735 200 L545 200 Z',
      'M545 200 L735 200 L810 330 L470 330 Z',
      'M470 330 L810 330 L890 465 L390 465 Z',
      'M390 465 L890 465 L975 610 L305 610 Z'
    ];
    const urut = [3,2,1,0];   // atas → bawah = lapisan 4,3,2,1
    el.innerHTML = `<div class="ia-pir">
      <svg viewBox="240 40 800 600">
        ${pts.map((d,i)=>`<path d="${d}" fill="${PIRAMID[urut[i]].warna}" data-l="${urut[i]}"/>`).join('')}
        ${pts.map((d,i)=>{
          const L = PIRAMID[urut[i]];
          const y = [150, 275, 410, 555][i];
          return `<text x="640" y="${y}" text-anchor="middle" fill="#fff"
                   font-size="30" font-weight="700" font-family="Fraunces,serif"
                   style="pointer-events:none">${L.no}</text>`;
        }).join('')}
      </svg>
      <div class="pir-kotak" id="pirBox"></div>
    </div>`;

    const kotak = el.querySelector('#pirBox');
    function papar(i){
      const L = PIRAMID[i];
      kotak.innerHTML = `<div class="lbl">Lapisan ${L.no} · ${bersih(L.en)}</div>
        <h4>${bersih(L.nama)}</h4>
        <p><b>Fokus:</b> ${bersih(L.fokus)}</p>
        <p><b>Aplikasi:</b> ${bersih(L.aplikasi)}</p>
        <div class="siapa"><b>Diterajui:</b> ${bersih(L.siapa)}</div>`;
      el.querySelectorAll('path').forEach(p=>p.classList.toggle('sel', +p.dataset.l === i));
    }
    el.querySelectorAll('path').forEach(p=>{
      p.onclick = () => papar(+p.dataset.l);
    });
    papar(2);   // mula pada Lapisan 3 — tempat PFA berada
  }

  function pasangNafas(el){
    el.innerHTML = `<div class="ia-nafas">
      <div class="nf-bulat" id="nfB"><b id="nfF">4·7·8</b><small id="nfS">tekan mula</small></div>
      <div class="nf-kawal">
        <button class="nf-btn" id="nfGo">Mula</button>
        <span class="nf-kira" id="nfK">Kitaran 0</span>
      </div>
    </div>`;
    const fasa = [
      { n:'Tarik nafas', d:4, sk:1.16 },
      { n:'Tahan',       d:7, sk:1.16 },
      { n:'Hembus',      d:8, sk:.80 }
    ];
    let jalan=false, fi=0, baki=0, kit=0, timer=null;
    const B=el.querySelector('#nfB'), F=el.querySelector('#nfF'),
          S=el.querySelector('#nfS'), K=el.querySelector('#nfK'),
          G=el.querySelector('#nfGo');

    function mulaFasa(){
      const f = fasa[fi];
      baki = f.d;
      S.textContent = f.n;
      B.style.transitionDuration = f.d + 's';
      B.style.transform = 'scale(' + f.sk + ')';
      F.textContent = baki;
    }
    function detik(){
      baki--;
      if (baki <= 0){
        fi++;
        if (fi >= fasa.length){ fi = 0; kit++; K.textContent = 'Kitaran ' + kit; }
        mulaFasa();
      } else {
        F.textContent = baki;
      }
    }
    G.onclick = () => {
      jalan = !jalan;
      if (jalan){
        G.textContent = 'Henti'; fi = 0; mulaFasa();
        timer = setInterval(detik, 1000);
      } else {
        G.textContent = 'Mula'; clearInterval(timer);
        B.style.transitionDuration = '.6s'; B.style.transform = 'scale(1)';
        F.textContent = '4·7·8'; S.textContent = 'tekan mula';
      }
    };
    el._henti = () => { clearInterval(timer); };
  }

  function pasangGrounding(el){
    el.innerHTML = `<div class="ia-gr">
      ${GROUNDING.map((g,i)=>`<div class="gr-b" data-i="${i}">
        <div class="n">${g.n}</div>
        <div><b>${bersih(g.deria)}</b><small>${bersih(g.arahan)}</small></div>
      </div>`).join('')}
    </div>`;
    let i = -1, timer = null;
    const baris = el.querySelectorAll('.gr-b');
    baris.forEach(b => b.onclick = () => {
      i = +b.dataset.i;
      baris.forEach((x,n)=>x.classList.toggle('aktif', n === i));
    });
    el._henti = () => clearInterval(timer);
  }

  function pasangValidasi(el){
    el.innerHTML = `<div class="ia-val">
      ${VALIDASI.map(v=>`<div class="vl">
        <div class="elak"><div class="lbl">Elakkan · ${bersih(v.kategori)}</div><p>${bersih(v.buruk)}</p></div>
        <div class="ganti"><div class="lbl">Gantikan dengan</div><p>${bersih(v.baik)}</p></div>
      </div>`).join('')}
    </div>`;
  }

  const IA = { piramid:pasangPiramid, nafas:pasangNafas, grounding:pasangGrounding, validasi:pasangValidasi };

  /* ==========================================================
     PAPARAN
     ========================================================== */
  const slaidEl = $('#slaid');
  let iaAktif = null;

  function render(){
    const d = DECK[iu];
    const item = d.slaid[is];
    if (iaAktif && iaAktif._henti) iaAktif._henti();
    iaAktif = null;

    slaidEl.classList.toggle('gelap', item.jenis === 'kulit');

    let html = '';
    if (item.jenis === 'kulit')        html = htmlKulit(item.unit);
    else if (item.jenis === 'bawa')    html = htmlBawa(item.unit);
    else                               html = htmlSeksyen(item.unit, item.s, is, d.slaid.length - 1);

    slaidEl.innerHTML = html +
      `<div class="s-heal">Sokongan emosi: <b>Talian HEAL 15555</b> · setiap hari 8:00 pagi – 12:00 tengah malam</div>`;

    /* pasang komponen interaktif jika ada */
    const kotakIA = slaidEl.querySelector('[data-ia]');
    if (kotakIA){
      const f = IA[kotakIA.dataset.ia];
      if (f){ f(kotakIA); iaAktif = kotakIA; }
    }

    autoSuai();

    $('#kNo').textContent = (is + 1) + ' / ' + d.slaid.length;
    $('#kUnit').textContent = 'Unit ' + d.unit.id;
    $('#bPrev').disabled = (iu === 0 && is === 0);
    $('#bNext').disabled = (iu === DECK.length - 1 && is === d.slaid.length - 1);

    document.querySelectorAll('.ub').forEach((b,n)=>b.classList.toggle('on', n === iu));
    muat();
  }

  /* Auto-suai: kecilkan teks sedikit demi sedikit sehingga kandungan
     muat dalam tinggi slaid. Melindungi daripada limpahan jika kandungan
     dikemas kini kemudian. */
  function autoSuai(){
    const badan = slaidEl.querySelector('.s-badan');
    if (!badan) return;
    let f = 1;
    badan.style.setProperty('--fit', f);
    let jaga = 0;
    while (badan.scrollHeight > badan.clientHeight + 1 && f > 0.60 && jaga < 24){
      f -= 0.04; jaga++;
      badan.style.setProperty('--fit', f.toFixed(2));
    }
  }

  /* skala slaid 1280x720 supaya muat dalam pentas */
  function muat(){
    const p = $('#pentas');
    const sk = Math.min(p.clientWidth / 1280, p.clientHeight / 720) * 0.94;
    slaidEl.style.transform = 'scale(' + sk + ')';
  }

  function pergiUnit(n){
    if (n < 0 || n >= DECK.length) return;
    iu = n; is = 0; render();
  }
  function seterusnya(){
    const d = DECK[iu];
    if (is < d.slaid.length - 1){ is++; render(); }
    else if (iu < DECK.length - 1){ iu++; is = 0; render(); }
  }
  function sebelum(){
    if (is > 0){ is--; render(); }
    else if (iu > 0){ iu--; is = DECK[iu].slaid.length - 1; render(); }
  }

  /* ---------- sidebar ---------- */
  $('#sbList').innerHTML = DECK.map((d,i)=>`
    <button class="ub" data-u="${i}">
      <span class="no">${d.unit.id}</span>
      <span class="tx"><b>${bersih(d.unit.tajuk)}</b><small>${d.slaid.length} slaid · ${bersih(d.unit.tempoh)}</small></span>
    </button>`).join('');
  document.querySelectorAll('.ub').forEach(b => b.onclick = () => pergiUnit(+b.dataset.u));

  /* ---------- kawalan ---------- */
  $('#bNext').onclick = seterusnya;
  $('#bPrev').onclick = sebelum;
  $('#zonKanan').onclick = seterusnya;
  $('#zonKiri').onclick = sebelum;
  $('#bSb').onclick = () => { $('#sb').classList.toggle('tutup'); setTimeout(muat, 280); };
  $('#bFull').onclick = () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen().catch(()=>{});
  };

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){ e.preventDefault(); seterusnya(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); sebelum(); }
    else if (e.key === 'Home'){ is = 0; render(); }
    else if (e.key === 'End'){ is = DECK[iu].slaid.length - 1; render(); }
    else if (e.key >= '1' && e.key <= '8'){ pergiUnit(+e.key - 1); }
    else if (e.key === 's' || e.key === 'S'){ $('#bSb').click(); }
    else if (e.key === 'f' || e.key === 'F'){ $('#bFull').click(); }
  });

  /* sapuan skrin */
  let x0 = null, y0 = null;
  document.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  document.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) dx < 0 ? seterusnya() : sebelum();
    x0 = null; y0 = null;
  }, {passive:true});

  /* Kawalan lesap apabila tetikus diam — supaya slaid penuh tidak terhalang
     semasa pembentangan. Ia muncul semula sebaik tetikus digerakkan. */
  (function(){
    const bar = document.querySelector('.kawal');
    let t = null;
    function bangun(){
      bar.classList.remove('lesap');
      clearTimeout(t);
      t = setTimeout(()=> bar.classList.add('lesap'), 2600);
    }
    ['mousemove','keydown','touchstart','click'].forEach(ev =>
      document.addEventListener(ev, bangun, {passive:true}));
    bar.addEventListener('mouseenter', ()=>{ clearTimeout(t); bar.classList.remove('lesap'); });
    bangun();
  })();

  window.addEventListener('resize', muat);
  document.addEventListener('fullscreenchange', () => setTimeout(muat, 120));

  setTimeout(()=>{ $('#tip').style.opacity = '0'; }, 5200);
  render();
})();
</script>
</body>
</html>
